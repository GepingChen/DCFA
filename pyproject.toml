[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcfa"
version = "0.1.0"
description = "Auditable local development runtime for TabCF Analyst"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "scikit-learn>=1.2,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
managed-client = ["tabpfn-client==0.3.3"]
gemini = ["google-genai==2.18.1"]
tabpfn = ["tabpfn", "torch"]
ui = ["fastapi>=0.141,<1", "gradio>=5,<7", "uvicorn>=0.52,<1"]
zerogpu = [
  "google-genai==2.18.1",
  "gradio[oauth]==6.22.0",
  "huggingface-hub==1.27.0",
  "spaces==0.51.1",
  "tabpfn==8.5.0",
  "torch==2.11.0",
]

[project.scripts]
dcfa = "dcfa.cli:main"
dcfa-ui = "dcfa.app:main"
dcfa-website-demo = "dcfa_website_demo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
